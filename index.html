<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 HEN HOST</title>

<style>
body {
    background: #10141e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
.container {
    max-width: 650px;
    margin: auto;
}
h1 { color: #54a1ff; }
.panel {
    background: #1d2635;
    padding: 20px;
    margin: 18px 0;
    border-radius: 14px;
    border: 1px solid #364862;
}
button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 0;
    border-radius: 8px;
    background: #2879ed;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button.secondary { background: #39465b; }
#status, #result {
    margin-top: 15px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}
#status { color: #7fe4a8; }
a { color: #8fc1ff; }
.warning {
    background: #302719;
    color: #ffdc96;
    padding: 15px;
    border-radius: 9px;
    line-height: 1.8;
}
</style>
</head>

<body>
<div class="container">

<h1>PS4 HEN HOST</h1>
<p>واجهة مشروع PS4 — Firmware 14.00</p>

<div class="panel">
    <h2>حالة المشروع</h2>
    <div id="status">الصفحة جاهزة</div>

    <button onclick="checkRepository()">
        التحقق من المستودع
    </button>

    <button class="secondary" onclick="showFiles()">
        عرض روابط ملفات المشروع
    </button>

    <div id="result" aria-live="polite"></div>
</div>

<div class="panel">
    <h2>مستودع HEN</h2>
    <p>
        <a href="https://github.com/mi0915388186-sketch/ps4-hen">
            فتح مستودع GitHub
        </a>
    </p>
    <p>
        <a href="https://github.com/mi0915388186-sketch/ps4-hen/tree/main/installer">
            مجلد installer
        </a>
    </p>
    <p>
        <a href="https://github.com/mi0915388186-sketch/ps4-hen/tree/main/kpayload">
            مجلد kpayload
        </a>
    </p>
    <p>
        <a href="https://github.com/mi0915388186-sketch/ps4-hen/blob/main/hen.ini">
            ملف hen.ini
        </a>
    </p>
</div>

<div class="warning">
    تنبيه: هذه الصفحة لا تحتوي على استغلال أمني أو HEN.
    فتح المستودع أو ملف hen.ini لا يفعّل التهكير.
    يجب التحقق من توافق الاستغلال مع النظام 14.00.
</div>

</div>

<script>
"use strict";

const repo =
"https://github.com/mi0915388186-sketch/ps4-hen";

function checkRepository() {
    document.getElementById("status").textContent =
        "افتح المستودع للتحقق من الملفات وإصدارات النظام المدعومة.";

    document.getElementById("result").innerHTML =
        '<a href="' + repo + '">فتح المستودع على GitHub</a>';
}

function showFiles() {
    document.getElementById("result").innerHTML =
        '<a href="' + repo + '/tree/main/installer">installer</a><br>' +
        '<a href="' + repo + '/tree/main/kpayload">kpayload</a><br>' +
        '<a href="' + repo + '/blob/main/hen.ini">hen.ini</a>';
}
</script>

</body>
    </html>
